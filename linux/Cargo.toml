[workspace]
members = [
    "app/api",
    "app/backend",
    "app/config",
    "app/frontend",
    "app/launcher",
]
default-members = ["app/launcher"]
resolver = "2"

[workspace.package]
version = "0.4.0"
edition = "2021"
license = "MIT"
rust-version = "1.88"

[workspace.dependencies]
eframe = "0.31"
image = { version = "0.25", default-features = false, features = ["png"] }
libc = "0.2"
rfd = "0.15"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rktools-api = { path = "app/api" }
rktools-backend = { path = "app/backend" }
rktools-config = { path = "app/config" }
rktools-frontend = { path = "app/frontend" }

[profile.release]
lto = "thin"
strip = true
