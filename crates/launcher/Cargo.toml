[package]
name = "rkflash"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Rockchip USB flashing desktop utility"
default-run = "rkflash"

[dependencies]
rkflash-frontend.workspace = true

# 每个目标平台只链接自己的平台 crate。
[target.'cfg(windows)'.dependencies]
rkflash-platform-windows.workspace = true

[target.'cfg(not(windows))'.dependencies]
rkflash-platform-linux.workspace = true
