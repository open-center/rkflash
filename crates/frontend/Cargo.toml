[package]
name = "rkflash-frontend"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "RKFlash egui desktop frontend"

[dependencies]
eframe.workspace = true
image.workspace = true
rfd.workspace = true
rkflash-api.workspace = true

[features]
# wgpu 渲染器由需要它的平台包启用（Windows：没有 OpenGL 2+ 的虚拟机、远程桌面经 Direct3D/WARP 显示）。
wgpu = ["eframe/wgpu"]
