[workspace]
# 依赖方向：launcher → platforms/* → runtime → application → core；frontend 只依赖 api。
members = [
    "crates/core",
    "crates/api",
    "crates/config",
    "crates/application",
    "crates/runtime",
    "crates/frontend",
    "crates/platforms/linux",
    "crates/platforms/windows",
    "crates/launcher",
]
default-members = ["crates/launcher"]
resolver = "2"

[workspace.package]
version = "0.5.0"
edition = "2021"
license = "MIT"
rust-version = "1.88"

[workspace.dependencies]
eframe = "0.31"
image = { version = "0.25", default-features = false, features = ["png"] }
libc = "0.2"
rfd = "0.15"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rkflash-api = { path = "crates/api" }
rkflash-application = { path = "crates/application" }
rkflash-config = { path = "crates/config" }
rkflash-core = { path = "crates/core" }
rkflash-frontend = { path = "crates/frontend" }
rkflash-platform-linux = { path = "crates/platforms/linux" }
rkflash-platform-windows = { path = "crates/platforms/windows" }
rkflash-runtime = { path = "crates/runtime" }

[profile.release]
lto = "thin"
strip = true
