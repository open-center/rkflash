[workspace]
members = [
    "crates/api",
    "crates/core",
    "crates/backend",
    "crates/config",
    "crates/frontend",
    "crates/launcher",
]
default-members = ["crates/launcher"]
resolver = "2"

[workspace.package]
version = "0.4.1"
edition = "2021"
license = "MIT"
rust-version = "1.88"

[workspace.dependencies]
eframe = "0.31"
image = { version = "0.25", default-features = false, features = ["png"] }
libc = "0.2"
rfd = "0.15"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rkflash-api = { path = "crates/api" }
rkflash-backend = { path = "crates/backend" }
rkflash-config = { path = "crates/config" }
rkflash-core = { path = "crates/core" }
rkflash-frontend = { path = "crates/frontend" }

[profile.release]
lto = "thin"
strip = true
