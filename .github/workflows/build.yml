name: Build & Release

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

env:
  # Rockchip 闭源 upgrade_tool：固定上游提交，构建脚本再按 linux/packaging/upgrade_tool.sha256 校验。
  UPGRADE_TOOL_URL: https://raw.githubusercontent.com/vicharak-in/Linux_Upgrade_Tool/266e4c0f59d36a5f9b395a78255d6af04222279c/upgrade_tool

jobs:
  version:
    name: Version
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.read.outputs.version }}
    steps:
      - uses: actions/checkout@v5

      - name: Check VERSION is synced to linux/ and macos/
        run: scripts/version.sh check

      - name: Check tag matches VERSION
        if: github.ref_type == 'tag'
        run: |
          [[ "$GITHUB_REF_NAME" == "v$(cat VERSION)" ]] || {
            echo "标签 $GITHUB_REF_NAME 与 VERSION $(cat VERSION) 不一致"; exit 1; }

      - id: read
        run: echo "version=$(cat VERSION)" >> "$GITHUB_OUTPUT"

  linux:
    name: Ubuntu (.deb, amd64)
    needs: version
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - name: Fetch upgrade_tool
        working-directory: linux
        run: |
          mkdir -p tools
          curl -fsSL --retry 3 -o tools/upgrade_tool "$UPGRADE_TOOL_URL"
          chmod +x tools/upgrade_tool
          sha256sum --check packaging/upgrade_tool.sha256

      - name: Check (fmt / architecture / test / clippy)
        run: make linux-check

      - name: Build .deb
        run: make linux

      - uses: actions/upload-artifact@v5
        with:
          name: linux-amd64
          path: dist/*
          if-no-files-found: error

  macos:
    name: macOS (.dmg, ${{ matrix.arch }})
    needs: version
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            runner: macos-15
          - arch: x86_64
            runner: macos-15-intel
    steps:
      - uses: actions/checkout@v5

      - name: Check
        run: make macos-check MAC_ARCH=${{ matrix.arch }}

      - name: Build .dmg
        run: make macos MAC_ARCH=${{ matrix.arch }}

      - uses: actions/upload-artifact@v5
        with:
          name: macos-${{ matrix.arch }}
          path: dist/*
          if-no-files-found: error

  # 推送到 main：刷新滚动预发布 nightly；推送 v* 标签：创建正式 Release。PR 只构建不发布。
  release:
    name: GitHub Release
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    needs: [version, linux, macos]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/download-artifact@v5
        with:
          path: dist
          merge-multiple: true

      - name: Write checksums
        working-directory: dist
        run: |
          sha256sum * > SHA256SUMS
          cat SHA256SUMS

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          sed "s/{VERSION}/$VERSION/g" .github/release-notes.md > notes.md
          if [[ "$GITHUB_REF_TYPE" == tag ]]; then
            gh release create "$GITHUB_REF_NAME" dist/* \
              --title "RKFlash $VERSION" \
              --notes-file notes.md
          else
            # 删除旧的 nightly 及其标签后在当前提交重建，保证产物始终对应 main 最新提交
            gh release delete nightly --cleanup-tag --yes || true
            {
              echo "> 自动构建：main@${GITHUB_SHA::7}，$(date -u '+%Y-%m-%d %H:%M UTC')。未经真机验证，正式版本请使用 v* 发布。"
              echo
              cat notes.md
            } > nightly-notes.md
            gh release create nightly dist/* \
              --target "$GITHUB_SHA" \
              --prerelease \
              --title "RKFlash $VERSION 最新构建（main@${GITHUB_SHA::7}）" \
              --notes-file nightly-notes.md
          fi
