name: Build & Release

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

env:
  # Rockchip 闭源 upgrade_tool：固定上游提交，构建脚本再按 linux/packaging/upgrade_tool.sha256 校验。
  UPGRADE_TOOL_URL: https://raw.githubusercontent.com/vicharak-in/Linux_Upgrade_Tool/266e4c0f59d36a5f9b395a78255d6af04222279c/upgrade_tool

jobs:
  version:
    name: Version
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.read.outputs.version }}
    steps:
      - uses: actions/checkout@v5

      - name: Check VERSION is synced to linux/ and macos/
        run: scripts/version.sh check

      - name: Check tag matches VERSION
        if: github.ref_type == 'tag'
        run: |
          [[ "$GITHUB_REF_NAME" == "v$(cat VERSION)" ]] || {
            echo "标签 $GITHUB_REF_NAME 与 VERSION $(cat VERSION) 不一致"; exit 1; }

      - id: read
        run: echo "version=$(cat VERSION)" >> "$GITHUB_OUTPUT"

  linux:
    name: Ubuntu (.deb, amd64)
    needs: version
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - name: Fetch upgrade_tool
        working-directory: linux
        run: |
          mkdir -p tools
          curl -fsSL --retry 3 -o tools/upgrade_tool "$UPGRADE_TOOL_URL"
          chmod +x tools/upgrade_tool
          sha256sum --check packaging/upgrade_tool.sha256

      - name: Check (fmt / architecture / test / clippy)
        run: make linux-check

      - name: Build .deb
        run: make linux

      - uses: actions/upload-artifact@v5
        with:
          name: linux-amd64
          path: dist/*
          if-no-files-found: error

  macos:
    name: macOS (.dmg, ${{ matrix.arch }})
    needs: version
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            runner: macos-15
          - arch: x86_64
            runner: macos-15-intel
    steps:
      - uses: actions/checkout@v5

      - name: Check
        run: make macos-check MAC_ARCH=${{ matrix.arch }}

      - name: Build .dmg
        run: make macos MAC_ARCH=${{ matrix.arch }}

      - uses: actions/upload-artifact@v5
        with:
          name: macos-${{ matrix.arch }}
          path: dist/*
          if-no-files-found: error

  # Windows 版全部组件在 Linux 上用 MinGW-w64 交叉编译，安装程序由 NSIS 生成。
  windows:
    name: Windows (setup/zip, x64)
    needs: version
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - name: Install MinGW-w64, NSIS and 7-Zip
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends mingw-w64 nsis p7zip-full zip
          sudo update-alternatives --set x86_64-w64-mingw32-gcc /usr/bin/x86_64-w64-mingw32-gcc-posix
          sudo update-alternatives --set x86_64-w64-mingw32-g++ /usr/bin/x86_64-w64-mingw32-g++-posix

      - name: Install Rust Windows target
        working-directory: linux
        run: |
          rustup toolchain install
          rustup target add x86_64-pc-windows-gnu

      - name: Clippy (Windows target)
        working-directory: linux
        run: cargo clippy --locked --workspace --all-targets --target x86_64-pc-windows-gnu -- -D warnings

      - name: Build setup and zip
        run: make windows WIN_CROSS=x86_64-w64-mingw32-

      - uses: actions/upload-artifact@v5
        with:
          name: windows-x64
          path: dist/*
          if-no-files-found: error

  # 在真实 Windows 上静默安装：校验文件、核心工具、WinUSB 驱动预装、界面启动与卸载。
  windows-smoke:
    name: Windows install smoke test
    needs: windows
    runs-on: windows-2025
    steps:
      - uses: actions/download-artifact@v5
        with:
          name: windows-x64
          path: dist

      - name: Silent install
        shell: pwsh
        run: |
          $setup = Get-ChildItem dist -Filter '*-setup.exe' | Select-Object -First 1
          $process = Start-Process $setup.FullName -ArgumentList '/S' -Wait -PassThru
          if ($process.ExitCode -ne 0) { throw "安装程序返回 $($process.ExitCode)" }
          $dir = Join-Path $env:ProgramFiles 'RKFlash'
          foreach ($file in 'rkflash.exe', 'rkdeveloptool.exe', 'driver\wdi-simple.exe', 'uninstall.exe') {
            if (-not (Test-Path (Join-Path $dir $file))) { throw "缺少 $file" }
          }

      - name: rkdeveloptool runs
        shell: pwsh
        run: |
          $tool = Join-Path $env:ProgramFiles 'RKFlash\rkdeveloptool.exe'
          & $tool -v
          if ($LASTEXITCODE -ne 0) { throw "rkdeveloptool -v 返回 $LASTEXITCODE" }
          & $tool ld
          "ld 返回 $LASTEXITCODE（无设备时非零属正常）"

      - name: WinUSB driver preinstalled
        shell: pwsh
        run: |
          $drivers = pnputil /enum-drivers | Out-String
          $found = [regex]::Matches($drivers, 'rockchip_[0-9a-f]{4}\.inf')
          "驱动库中的 Rockchip WinUSB INF：$($found.Count) 个"
          if ($found.Count -lt 1) { $drivers; throw '未找到预装的 Rockchip WinUSB 驱动' }

      - name: GUI starts
        shell: pwsh
        run: |
          $app = Start-Process (Join-Path $env:ProgramFiles 'RKFlash\rkflash.exe') -PassThru
          Start-Sleep -Seconds 10
          if ($app.HasExited) { throw "rkflash.exe 启动后退出，退出码 $($app.ExitCode)" }
          Stop-Process -Id $app.Id

      - name: Silent uninstall
        shell: pwsh
        run: |
          $dir = Join-Path $env:ProgramFiles 'RKFlash'
          Start-Process (Join-Path $dir 'uninstall.exe') -ArgumentList '/S', "_?=$dir" -Wait
          if (Test-Path (Join-Path $dir 'rkflash.exe')) { throw '卸载后仍残留 rkflash.exe' }

  # 推送到 main：刷新滚动预发布 nightly；推送 v* 标签：创建正式 Release。PR 只构建不发布。
  release:
    name: GitHub Release
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    needs: [version, linux, macos, windows, windows-smoke]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/download-artifact@v5
        with:
          path: dist
          merge-multiple: true

      - name: Write checksums
        working-directory: dist
        run: |
          sha256sum * > SHA256SUMS
          cat SHA256SUMS

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          sed "s/{VERSION}/$VERSION/g" .github/release-notes.md > notes.md
          if [[ "$GITHUB_REF_TYPE" == tag ]]; then
            gh release create "$GITHUB_REF_NAME" dist/* \
              --title "RKFlash $VERSION" \
              --notes-file notes.md
          else
            # 删除旧的 nightly 及其标签后在当前提交重建，保证产物始终对应 main 最新提交
            gh release delete nightly --cleanup-tag --yes || true
            {
              echo "> 自动构建：main@${GITHUB_SHA::7}，$(date -u '+%Y-%m-%d %H:%M UTC')。未经真机验证，正式版本请使用 v* 发布。"
              echo
              cat notes.md
            } > nightly-notes.md
            gh release create nightly dist/* \
              --target "$GITHUB_SHA" \
              --prerelease \
              --title "RKFlash $VERSION 最新构建（main@${GITHUB_SHA::7}）" \
              --notes-file nightly-notes.md
          fi
