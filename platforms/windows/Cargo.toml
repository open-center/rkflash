[package]
name = "rkflash-platform-windows"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "RKFlash Windows platform: rkdeveloptool adapter, Win32 host and desktop profile"

[dependencies]
rkflash-application.workspace = true
rkflash-config.workspace = true
rkflash-core.workspace = true
rkflash-frontend = { workspace = true, features = ["wgpu"] }
rkflash-runtime.workspace = true

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_System_SystemInformation",
    "Win32_System_Threading",
] }
